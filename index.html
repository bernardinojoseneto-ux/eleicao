<title>Apuração 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: placar nacional (Lula x Bolsonaro) no topo; mapa por estado à esquerda; painel do estado (presidente + governador, quando há 2º turno) à direita */
:root{
  --bg:#f1f3f6; --panel:#ffffff; --fg:#141a22; --muted:#5a6573; --line:#d8dde5; --soft:#e9edf2; --none:#dde2e9; --live:#d92d20;
  --lula:#e5091f; --bolso:#0a50ff;
  --o0:#8e5bd1; --o1:#b97a0a; --o2:#1f8f86; --o3:#7a8594; --o4:#b5527f;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1217; --panel:#161b22; --fg:#e8ecf1; --muted:#97a2b0; --line:#29313b; --soft:#1f262f; --none:#232a33; --live:#ff5a4d;
    --lula:#ff2f45; --bolso:#2f7bff;
    --o0:#b18cf0; --o1:#e3a73c; --o2:#3fc7bb; --o3:#9aa5b4; --o4:#e58bb3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1217; --panel:#161b22; --fg:#e8ecf1; --muted:#97a2b0; --line:#29313b; --soft:#1f262f; --none:#232a33; --live:#ff5a4d;
  --lula:#ff2f45; --bolso:#2f7bff;
  --o0:#b18cf0; --o1:#e3a73c; --o2:#3fc7bb; --o3:#9aa5b4; --o4:#e58bb3;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.4;
  padding-block:20px 32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1600px; margin:0 auto}
.top{display:flex; flex-wrap:wrap; gap:12px 24px; align-items:flex-end; justify-content:space-between; padding-bottom:14px; border-bottom:2px solid var(--fg)}
h1{font-family:var(--display); font-weight:700; font-size:clamp(34px,6vw,52px); line-height:.95; margin:0; letter-spacing:.01em; text-transform:uppercase; text-wrap:balance}
.sub{margin:6px 0 0; color:var(--muted); font-size:14px}
.status{display:flex; align-items:center; gap:14px; font-family:var(--display); font-size:20px; font-weight:600; letter-spacing:.06em}
.live{display:inline-flex; align-items:center; gap:8px; color:var(--live)}
.live i{width:10px; height:10px; border-radius:50%; background:var(--live); animation:pulse 1.4s ease-in-out infinite}
.live.off{color:var(--muted)} .live.off i{animation:none; background:var(--muted)}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.35; transform:scale(.75)}}
.clock{color:var(--muted); font-variant-numeric:tabular-nums; font-size:17px}

.controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 0 16px}
.btn{font:inherit; font-size:14px; font-weight:600; color:var(--fg); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:7px 12px; cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.btn:focus-visible,.row:focus-visible{outline:2px solid var(--fg); outline-offset:2px}
.seg{display:inline-flex}
.seg .btn{border-radius:0; margin-left:-1px}
.seg .btn:first-child{border-radius:6px 0 0 6px; margin-left:0}
.seg .btn:last-child{border-radius:0 6px 6px 0}
.ctl-label{color:var(--muted); font-size:13px}
.chip{margin-left:auto; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:4px 8px}
.chip.demo{color:var(--fg); border:1px dashed var(--fg)}
.banner{margin:0 0 16px; padding:10px 14px; border-radius:6px; border:1px solid var(--live); color:var(--fg); background:var(--panel); font-size:14px}

.hero{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-bottom:20px}
.duel{display:grid; grid-template-columns:minmax(0,1fr) minmax(150px,.65fr) minmax(0,1fr); gap:16px; align-items:end}
.side .nm{font-family:var(--display); font-weight:700; font-size:clamp(22px,3.6vw,32px); line-height:1.05; text-transform:uppercase; padding-bottom:4px; border-bottom:4px solid var(--cor)}
.side .pc{font-family:var(--display); font-weight:700; font-size:clamp(50px,9vw,88px); line-height:.95; color:var(--cor); margin-top:6px; font-variant-numeric:tabular-nums}
.side .pc small{font-size:.45em; font-weight:600}
.side .vt{color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums}
.side.r{text-align:right}
.mid{text-align:center}
.mid .big{font-family:var(--display); font-weight:700; font-size:clamp(34px,5vw,48px); line-height:1; font-variant-numeric:tabular-nums}
.mid .big small{font-size:.5em; color:var(--muted)}
.stack{display:flex; height:16px; border-radius:4px; overflow:hidden; margin-top:16px; background:var(--soft)}
.stack b{display:block; height:100%; transition:width .6s}
.others{margin:10px 0 0; font-size:13px; color:var(--muted)}
.others span{white-space:nowrap; margin-right:12px}
.others i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px}
@media (max-width:640px){.duel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .mid{grid-column:1/-1; order:3}}

.grid{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr); gap:20px; align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.mapcard{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px}
#map{display:block; width:100%; height:auto; max-height:78vh}
#map path{stroke:var(--panel); stroke-width:1; stroke-linejoin:round; cursor:pointer; transition:fill-opacity .6s, fill .6s}
#map path:hover{stroke:var(--fg); stroke-width:2}
#map path.sel{stroke:var(--fg); stroke-width:2.6}
#map path:focus-visible{outline:none; stroke:var(--fg); stroke-width:2.6}
#map text{font-family:var(--display); font-weight:600; font-size:10px; fill:var(--fg); pointer-events:none; paint-order:stroke; stroke:var(--panel); stroke-width:2.4px; stroke-opacity:.85; text-anchor:middle; dominant-baseline:central}
#map circle{fill:var(--fg); stroke:var(--panel); stroke-width:1.5; pointer-events:none}
.legend{display:flex; flex-wrap:wrap; gap:6px 18px; padding:8px 4px 2px; font-size:13px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.sw{width:12px; height:12px; border-radius:2px; display:inline-block}
.ramp{width:60px; height:8px; border-radius:2px; background:linear-gradient(90deg, color-mix(in srgb, var(--fg) 12%, transparent), var(--fg))}
.gdot{width:8px; height:8px; border-radius:50%; background:var(--fg); display:inline-block}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px; min-width:0}
.eyebrow{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0}
.big{font-family:var(--display); font-weight:700; font-size:clamp(46px,8vw,64px); line-height:1; font-variant-numeric:tabular-nums}
.big small{font-size:.45em; font-weight:600; color:var(--muted)}
.meter{height:10px; background:var(--soft); border-radius:5px; overflow:hidden; margin:10px 0 6px}
.meter b{display:block; height:100%; background:var(--fg); border-radius:5px; transition:width .6s}
.meta{margin:0; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
.sec{margin-top:20px; padding-top:16px; border-top:1px solid var(--line)}
.sec h3{font-family:var(--display); font-weight:700; font-size:24px; line-height:1; text-transform:uppercase; margin:0 0 4px; letter-spacing:.01em}
.cand{display:grid; grid-template-columns:1fr auto; gap:2px 12px; margin:12px 0}
.cand .nm{font-weight:600; min-width:0}
.cand .nm em{font-style:normal; font-weight:400; color:var(--muted); font-size:13px; margin-left:6px}
.cand .pc{font-family:var(--display); font-weight:700; font-size:26px; line-height:1; font-variant-numeric:tabular-nums}
.cand .bar{grid-column:1/-1; height:8px; background:var(--soft); border-radius:4px; overflow:hidden}
.cand .bar b{display:block; height:100%; border-radius:4px; transition:width .6s}
.cand .vt{grid-column:1/-1; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.back{margin-bottom:12px}
.state-name{font-family:var(--display); font-weight:700; font-size:36px; line-height:1; margin:2px 0 14px; text-transform:uppercase}
.kv{display:grid; grid-template-columns:1fr auto; gap:4px 12px; margin:0; font-size:14px; font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)} .kv dd{margin:0; text-align:right; font-weight:500}
.list{max-height:360px; overflow-y:auto; margin:8px -6px 0; padding:0 6px}
.row{display:grid; grid-template-columns:44px 1fr 52px; gap:10px; align-items:center; width:100%; font:inherit; color:inherit; background:none; border:0; border-bottom:1px solid var(--line); padding:7px 2px; text-align:left; cursor:pointer}
.row:hover{background:var(--soft)}
.row .uf{font-family:var(--display); font-weight:700; font-size:18px; display:flex; align-items:center; gap:6px}
.row .dot{width:8px; height:8px; border-radius:50%; flex:none}
.row .mini{height:6px; background:var(--soft); border-radius:3px; overflow:hidden}
.row .mini b{display:block; height:100%; background:var(--fg); opacity:.75}
.row .p{text-align:right; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.tag{font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; border:1px solid var(--fg); border-radius:3px; padding:1px 5px; margin-left:6px; vertical-align:middle}
.foot{margin:18px 0 0; font-size:12.5px; color:var(--muted); max-width:72ch}
.tip{position:fixed; z-index:20; pointer-events:none; background:var(--fg); color:var(--bg); border-radius:6px; padding:8px 10px; font-size:13px; line-height:1.35; max-width:230px; box-shadow:0 4px 14px rgb(0 0 0 / .25)}
.tip b{font-family:var(--display); font-size:18px; letter-spacing:.02em}
@media (prefers-reduced-motion: reduce){.live i{animation:none} #map path,.meter b,.cand .bar b,.stack b{transition:none}}

/* ---- v3: cabeçalho compacto, rádio e tela única ---- */
.top{align-items:center; padding-bottom:10px}
h1{font-size:clamp(26px,3.4vw,40px)}
.sub{margin:3px 0 0; font-size:13px}
.tools{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; justify-content:flex-end}
.tools .chip{margin-left:0}
.tools .status{gap:10px; font-size:17px}
.tools .clock{font-size:15px}
.radio{display:inline-flex; align-items:center; gap:8px}
#vol{width:84px; accent-color:var(--fg)}
.trk{font-size:12px; color:var(--muted); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.btn{padding:6px 11px}
.hero{padding:12px 16px; margin-bottom:0}
.side .nm{font-size:clamp(18px,2.4vw,27px)}
.side .pc{font-size:clamp(40px,6vw,66px); margin-top:2px}
.mid .big{font-size:clamp(28px,3.6vw,40px)}
.stack{height:12px; margin-top:10px}
.others,.hfoot{margin:6px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.banner{margin:0; padding:7px 12px; font-size:13px}
.wrap{display:flex; flex-direction:column; gap:10px; min-height:100%}
.mapcard{display:flex; flex-direction:column}
.panel{display:flex; flex-direction:column}
.panel .big{font-size:clamp(34px,4.5vw,48px)}
.state-name{font-size:30px; margin-bottom:8px}
.sec{margin-top:12px; padding-top:10px}
.cand{margin:8px 0}
@media (min-width:861px) and (min-height:600px){
  html,body{height:100%; overflow:hidden}
  body{padding-block:10px 12px}
  .wrap{height:100%; min-height:0}
  .grid{flex:1; min-height:0; grid-template-columns:minmax(0,1fr) minmax(340px,500px); grid-template-rows:minmax(0,1fr); align-items:stretch}
  .mapcard{height:100%; min-height:0}
  #map{flex:1; min-height:0; max-height:none; width:100%; height:100%}
  .panel{height:100%; min-height:0; overflow-y:auto}
  .panel .list{flex:1; min-height:0; max-height:none}
}

/* ---- v4: sem quadrado de foco, regiões, YouTube ---- */
#map path{outline:none; vector-effect:non-scaling-stroke}
#map path.dim{opacity:.16}
#map text{font-size:calc(12.5px*var(--z,1)); stroke-width:calc(3px*var(--z,1))}
#map text.sm{font-size:calc(8px*var(--z,1))}
#map circle{r:calc(3px*var(--z,1)); stroke-width:calc(1.5px*var(--z,1))}
#map text.dim,#map circle.dim{opacity:.2}
.regs{display:flex; flex-wrap:wrap; gap:6px; padding:0 0 8px}
.btn.sm{padding:4px 10px; font-size:13px}
.radio{position:relative}
.pop{position:absolute; right:0; top:calc(100% + 8px); z-index:40; width:min(340px,90vw); background:var(--panel); border:1px solid var(--fg); border-radius:8px; padding:12px; box-shadow:0 8px 24px rgb(0 0 0 / .3)}
.pop input[type=text]{width:100%; font:inherit; font-size:14px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg)}
.pop .acts{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.pop p{margin:8px 0 0; font-size:12.5px; color:var(--muted)}
.ytcard{position:fixed; left:max(16px, env(safe-area-inset-left, 0px)); bottom:calc(86px + env(safe-area-inset-bottom, 0px)); z-index:30; width:236px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; box-shadow:0 6px 20px rgb(0 0 0 / .3)}
.yth{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.ytcard iframe,.ytcard #ytp{display:block; width:220px; height:200px; border:0}
</style>

<div class="wrap">
  <header class="top">
    <div class="ttl">
      <h1>Apuração 2026</h1>
      <p class="sub" id="sub">Presidente no Brasil e por estado · Governador nos estados e no DF com 2º turno</p>
    </div>
    <div class="tools">
      <span class="ctl-label" id="lblTurno">Turno</span>
      <span class="seg" id="segTurno" role="group" aria-label="Turno">
        <button class="btn" type="button" data-turno="1" aria-pressed="false">1º turno</button>
        <button class="btn" type="button" data-turno="2" aria-pressed="true">2º turno</button>
      </span>
      <span id="demoCtl" hidden>
        <button class="btn" id="btnPause" type="button">Pausar</button>
        <span class="seg" role="group" aria-label="Velocidade da demonstração">
          <button class="btn" type="button" data-speed="1" aria-pressed="true">1×</button>
          <button class="btn" type="button" data-speed="4" aria-pressed="false">4×</button>
          <button class="btn" type="button" data-speed="12" aria-pressed="false">12×</button>
        </span>
        <button class="btn" id="btnReset" type="button">Reiniciar</button>
      </span>
      <span class="radio">
        <button class="btn" id="btnRadio" type="button" aria-pressed="false">♪ Ligar rádio</button>
        <button class="btn" id="btnNext" type="button" hidden>Próxima</button>
        <button class="btn" id="btnYt" type="button" aria-expanded="false">YouTube</button>
        <input id="vol" type="range" min="0" max="100" value="60" aria-label="Volume da rádio">
        <span class="trk" id="trk"></span>
        <div class="pop" id="pop" hidden>
          <input id="ytIn" type="text" placeholder="Cole o link de um vídeo ou playlist do YouTube" aria-label="Link do YouTube">
          <div class="acts"><button class="btn" id="ytGo" type="button">Tocar</button><button class="btn" id="ytOff" type="button">Voltar à música ambiente</button></div>
          <p>Funciona com vídeos e playlists que permitem incorporação. O player aparece no canto da tela.</p>
        </div>
      </span>
      <span class="chip" id="chip">Fonte: TSE</span>
      <span class="status">
        <span class="live off" id="live"><i></i><span id="liveTxt">CARREGANDO</span></span>
        <span class="clock" id="clock">--:--:--</span>
      </span>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>
  <section class="hero" id="hero" aria-label="Resultado nacional para presidente"></section>

  <main class="grid">
    <section class="mapcard">
      <div class="regs" id="regs" role="group" aria-label="Filtrar por região"></div>
      <svg id="map" viewBox="0 0 600 616" role="group" aria-label="Mapa do Brasil. Cor mostra quem lidera para presidente em cada estado."></svg>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
  <div class="tip" id="tip" hidden></div>
  <div class="ytcard" id="ytcard" hidden><div class="yth"><span>YouTube</span><button class="btn sm" id="ytClose" type="button" aria-label="Fechar player">×</button></div><div id="ytp"></div></div>
</div>

const nf = new Intl.NumberFormat('pt-BR');
const pct = (n, d = 1) => n.toFixed(d).replace('.', ',') + '%';
const I = v => { const n = parseInt(String(v == null ? '' : v).replace(/\D/g, ''), 10); return isNaN(n) ? 0 : n; };
const tc = s => String(s || '').toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase()).replace(/\s(Da|De|Do|Das|Dos|E)(?=\s)/g, x => x.toLowerCase());
const soma = a => a.reduce((x, c) => x + c.v, 0);

/* ---------- LEITURA DOS ARQUIVOS DO TSE ---------- */
function parseUnit(j){
  const cg = (j.carg || [])[0] || {}, lista = [];
  (cg.agr || []).forEach(a => (a.par || []).forEach(p => (p.cand || []).forEach(c => {
    lista.push({ nome: c.nmu || c.nm || '', n: I(c.n), partido: p.sg || '', v: I(c.vap), eleito: c.e === 's' });
  })));
  const s = j.s || {}, e = j.e || {}, v = j.v || {}, ts = I(s.ts), st = I(s.st);
  return { votos: lista, ts, st, f: ts ? st / ts : 0, eleit: I(e.te), vv: I(v.vv), vb: I(v.vb), vn: I(v.vn), ger: ((j.dg || '') + ' ' + (j.hg || '')).trim() };
}
function colorirPres(un){
  const outros = un.votos.filter(c => !isLula(c) && !isBolso(c)).sort((a, b) => a.n - b.n);
  un.votos.forEach(c => {
    if (c.cor) return;
    c.cor = isLula(c) ? 'var(--lula)' : isBolso(c) ? 'var(--bolso)' : 'var(' + OUTROS[outros.indexOf(c) % OUTROS.length] + ')';
  });
}
function colorirGov(un){
  const ord = [...un.votos].sort((a, b) => a.n - b.n);
  un.votos.forEach(c => { if (!c.cor) c.cor = 'var(' + OUTROS[ord.indexOf(c) % OUTROS.length] + ')'; });
}
const pad = ele => 'e00' + ele;
const caminhoPres = (ele, uf) => '/oficial/' + CICLO + '/' + ele + '/dados/' + uf.toLowerCase() + '/' + uf.toLowerCase() + '-c0001-' + pad(ele) + '-u.json';
const caminhoGov = (ele, uf) => '/oficial/' + CICLO + '/' + ele + '/dados/' + uf.toLowerCase() + '/' + uf.toLowerCase() + '-c0003-' + pad(ele) + '-u.json';
let usarEspelho = false;
async function buscar(caminho){
  const urls = usarEspelho ? ['./dados' + caminho] : [TSE + caminho, './dados' + caminho];
  let motivo = 'rede/CORS';
  for (let i = 0; i < urls.length; i++){
    try {
      const r = await fetch(urls[i], { cache: 'no-cache' });
      if (r.ok) return await r.json();
      motivo = 'HTTP ' + r.status;
    } catch (err){
      motivo = 'rede/CORS';
      if (i === 0 && !usarEspelho){ usarEspelho = true; }
    }
  }
  throw new Error(caminho.split('/').slice(-1)[0] + ' (' + motivo + ')');
}
async function carregarTSE(turno){
  const el = ELEICOES[turno];
  const jobs = [
    buscar(caminhoPres(el.fed, 'BR')).then(j => ['br', parseUnit(j)]),
    ...UFS.map(uf => buscar(caminhoPres(el.fed, uf)).then(j => ['uf:' + uf, parseUnit(j)])),
    ...GOV_UFS.map(uf => buscar(caminhoGov(el.est, uf)).then(j => ['gov:' + uf, parseUnit(j)]))
  ];
  const res = await Promise.allSettled(jobs);
  const out = { pres: { br: null, uf: {} }, gov: {}, falhas: 0, lista: [] };
  res.forEach(r => {
    if (r.status !== 'fulfilled'){ out.falhas++; out.lista.push(r.reason && r.reason.message ? r.reason.message : '?'); return; }
    const [k, un] = r.value;
    if (k === 'br'){ colorirPres(un); out.pres.br = un; }
    else if (k.startsWith('uf:')){ colorirPres(un); out.pres.uf[k.slice(3)] = un; }
    else { colorirGov(un); out.gov[k.slice(4)] = un; }
  });
  return out;
}

  const P = [['Candidato Vermelho', 'Demo', 'var(--lula)'], ['Candidato Azul', 'Demo', 'var(--bolso)']];
  const out = { pres: { br: null, uf: {} }, gov: {}, falhas: 0 };
  UFS.forEach(uf => { out.pres.uf[uf] = demoUnit(DM[uf], P, DM[uf].sp, DM[uf].bp); });
  const us = Object.values(out.pres.uf);
  const br = { votos: P.map((c, i) => ({ nome: c[0], partido: c[1], n: i + 1, cor: c[2], v: us.reduce((x, u) => x + u.votos[i].v, 0) })),
    ts: us.reduce((x, u) => x + u.ts, 0), st: us.reduce((x, u) => x + u.st, 0), eleit: us.reduce((x, u) => x + u.eleit, 0),
    vv: 0, vb: us.reduce((x, u) => x + u.vb, 0), vn: us.reduce((x, u) => x + u.vn, 0), ger: '' };
  br.f = br.st / br.ts; br.vv = soma(br.votos); out.pres.br = br;

function demoAvancar(mult){
  UFS.forEach(uf => { const m = DM[uf]; if (m.f >= 1) return; m.f = Math.min(1, m.f + m.rate * mult * (0.4 + Math.random() * 1.2)); if (m.f > 0.998) m.f = 1; });
}

/* ---------- ESTADO DA PÁGINA ---------- */
let regiao = null, D = null, sel = null, turno = 2, paused = false, speed = 1, timer = null, agora = new Date();

function lider(un){
  if (!un || !un.votos.length || !soma(un.votos)) return null;
  return un.votos.reduce((a, c) => c.v > a.v ? c : a, un.votos[0]);
}
function agregar(us){
  us = us.filter(Boolean); if (!us.length) return null;
  const m = new Map();
  us.forEach(u => u.votos.forEach(c => { const k = c.nome + '|' + c.n, x = m.get(k); if (x) x.v += c.v; else m.set(k, Object.assign({}, c)); }));
  const s = f => us.reduce((a, u) => a + (u[f] || 0), 0), ts = s('ts'), st = s('st');
  return { votos: [...m.values()], ts, st, f: ts ? st / ts : 0, eleit: s('eleit'), vv: s('vv'), vb: s('vb'), vn: s('vn'), ger: us[0].ger };
}
function ordenar(un){ return [...un.votos].sort((a, b) => b.v - a.v); }

/* ---------- MAPA ---------- */
const svg = document.getElementById('map'), NS = 'http://www.w3.org/2000/svg', pathEl = {}, lblEl = {}, dotEl = {}, BB = {};
function bbox(d){ const n = d.match(/-?\d+\.?\d*/g).map(Number); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (let i = 0; i + 1 < n.length; i += 2){ x0 = Math.min(x0, n[i]); x1 = Math.max(x1, n[i]); y0 = Math.min(y0, n[i+1]); y1 = Math.max(y1, n[i+1]); } return { x0, y0, x1, y1 }; }
function montarMapa(){
  const g = document.createElementNS(NS, 'g'), gl = document.createElementNS(NS, 'g'); svg.appendChild(g); svg.appendChild(gl);
  UFS.forEach(uf => {
    const st = GEO.states[uf], p = document.createElementNS(NS, 'path');
    p.setAttribute('d', st.d); p.dataset.uf = uf; p.setAttribute('tabindex', '0'); p.setAttribute('role', 'button');
    p.addEventListener('click', () => selecionar(uf));
    p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selecionar(uf); } });
    p.addEventListener('pointermove', e => dica(e, uf));
    p.addEventListener('pointerleave', () => { tip.hidden = true; });
    g.appendChild(p); pathEl[uf] = p;
    const t = document.createElementNS(NS, 'text'); t.setAttribute('x', st.cx); t.setAttribute('y', st.cy); t.textContent = uf;
    if (uf === 'DF') t.classList.add('sm'); gl.appendChild(t); lblEl[uf] = t; BB[uf] = bbox(st.d);
    if (GOV_UFS.includes(uf)){
      const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', st.cx); c.setAttribute('cy', st.cy + (uf === 'DF' ? 8 : 10)); c.setAttribute('r', 3); gl.appendChild(c); dotEl[uf] = c;
    }
  });
}
function pintar(){
  UFS.forEach(uf => {
    const un = D && D.pres.uf[uf], l = lider(un), p = pathEl[uf];
    if (!l){ p.style.fill = 'var(--none)'; p.style.fillOpacity = 1; }
    else { p.style.fill = l.cor; p.style.fillOpacity = (0.45 + 0.55 * un.f).toFixed(2); }
    p.setAttribute('aria-label', GEO.states[uf].name + (un ? ', ' + pct(un.f * 100) + ' apurado' : '') + (l ? ', lidera ' + tc(l.nome) : ''));
    p.classList.toggle('sel', uf === sel);
    const fora = !!regiao && !REGIOES[regiao].includes(uf);
    p.classList.toggle('dim', fora); lblEl[uf].classList.toggle('dim', fora); if (dotEl[uf]) dotEl[uf].classList.toggle('dim', fora);
  });
}
const tip = document.getElementById('tip');
function dica(e, uf){
  const un = D && D.pres.uf[uf]; if (!un) return;
  const l = lider(un), t = soma(un.votos);
  tip.innerHTML = '<b>' + GEO.states[uf].name + '</b><br>' + pct(un.f * 100) + ' das seções apuradas' +

/* ---------- PLACAR NACIONAL ---------- */
function lado(c, tot, cls){

    '<div class="pc">' + pct(p, 2).replace('%', '') + '<small>%</small></div><div class="vt">' + nf.format(c.v) + ' votos · ' + (c.partido || '') + '</div></div>';

const panel = document.getElementById('panel');
function linhas(un, max){
  const tot = soma(un.votos), ord = ordenar(un);
  let show = ord, resto = null;
  if (ord.length > max){ show = ord.slice(0, max - 1); const r = ord.slice(max - 1); resto = { n: r.length, v: soma(r) }; }

    '<div class="bar"><b style="width:' + p.toFixed(2) + '%;background:' + cor + '"></b></div><div class="vt">' + nf.format(v) + ' votos</div></div>';
  return show.map(c => item(tc(c.nome), c.partido + (c.eleito ? ' · eleito' : ''), tot ? c.v / tot * 100 : 0, c.cor, c.v)).join('') +
    (resto ? item('Demais candidatos', resto.n + ' candidatos', tot ? resto.v / tot * 100 : 0, 'var(--o3)', resto.v) : '');
}
function blocoApuracao(un){

    '<p class="meta">' + nf.format(un.st) + ' de ' + nf.format(un.ts) + ' seções apuradas</p>';

function painel(){

        : '<p class="meta">Sem dados para este estado agora.</p>') +

  } else {
    const ordem = (regiao ? REGIOES[regiao] : UFS).map(uf => ({ uf, un: D.pres.uf[uf] })).sort((a, b) => (b.un ? b.un.eleit : 0) - (a.un ? a.un.eleit : 0));
    panel.innerHTML =
      '<p class="eyebrow">Estados · presidente' + (regiao ? ' · ' + regiao : '') + '</p>' +
      '<div class="list">' + ordem.map(({ uf, un }) => {

        return '<button class="row" type="button" data-act="uf" data-uf="' + uf + '" data-focus="row-' + uf + '"><span class="uf"><span class="dot" style="background:' + (l ? l.cor : 'var(--none)') + '"></span>' + uf + '</span>' +
          '<span class="mini"><b style="width:' + (un ? (un.f * 100).toFixed(1) : 0) + '%"></b></span><span class="p">' + (un ? pct(un.f * 100) : '–') + '</span></button>';
      }).join('') + '</div>' +
      '<p class="foot">Clique em um estado no mapa ou na lista. Nos estados marcados com ponto no mapa (' + GOV_UFS.join(', ') + ') o painel também mostra o governador.</p>';
  }
  if (foco){ const e = panel.querySelector('[data-focus="' + foco + '"]'); if (e) e.focus({ preventScroll: true }); }
}
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'back') selecionar(null); else if (b.dataset.act === 'uf') selecionar(b.dataset.uf);
});
let vbAtual = [0, 0, 600, 616], vbAnim = null;
const escala = v => Math.min((svg.clientWidth || 600) / v[2], (svg.clientHeight || 616) / v[3]);
function aplicarVB(v){
  vbAtual = v; svg.setAttribute('viewBox', v.map(n => n.toFixed(1)).join(' '));
  const z = escala([0, 0, 600, 616]) / escala(v); svg.style.setProperty('--z', z.toFixed(3));
  for (const uf in dotEl) dotEl[uf].setAttribute('cy', (GEO.states[uf].cy + (uf === 'DF' ? 8 : 10) * z).toFixed(1));
}
function zoomPara(alvo){
  if (vbAnim) cancelAnimationFrame(vbAnim);
  const ini = vbAtual.slice();
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){ aplicarVB(alvo); return; }
  const t0 = performance.now();
  const passo = now => { const k = Math.min(1, (now - t0) / 380), e = 1 - Math.pow(1 - k, 3); aplicarVB(ini.map((x, i) => x + (alvo[i] - x) * e)); if (k < 1) vbAnim = requestAnimationFrame(passo); };
  vbAnim = requestAnimationFrame(passo);
}
function vbRegiao(){
  if (!regiao) return [0, 0, 600, 616];
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  REGIOES[regiao].forEach(uf => { const b = BB[uf]; x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1); });
  const w = x1 - x0, h = y1 - y0, p = Math.max(w, h) * 0.08;
  return [x0 - p, y0 - p, w + 2 * p, h + 2 * p];
}
function montarRegs(){
  document.getElementById('regs').innerHTML = ['Brasil'].concat(Object.keys(REGIOES)).map(n => {
    const v = n === 'Brasil' ? '' : n, on = (n === 'Brasil' && !regiao) || n === regiao;
    return '<button class="btn sm" type="button" data-reg="' + v + '" aria-pressed="' + on + '">' + n + '</button>';
  }).join('');
}
function setRegiao(r){
  regiao = r || null;
  if (sel && regiao && !REGIOES[regiao].includes(sel)) sel = null;
  montarRegs(); zoomPara(vbRegiao()); desenhar();
}
document.getElementById('regs').addEventListener('click', e => { const b = e.target.closest('[data-reg]'); if (b) setRegiao(b.dataset.reg); });
window.addEventListener('resize', () => aplicarVB(vbAtual));
function selecionar(uf){ sel = (uf === sel ? null : uf); desenhar(); }

function legenda(){
  document.getElementById('legend').innerHTML =
    '<span><i class="sw" style="background:var(--lula)"></i>Lula</span><span><i class="sw" style="background:var(--bolso)"></i>Bolsonaro</span>' +
    '<span><i class="sw" style="background:var(--o0)"></i>Outro candidato (1º turno)</span><span><i class="ramp"></i>mais seções apuradas</span>' +
    '<span><i class="gdot"></i>também tem governador</span>';
}

function desenhar(){
  const st = (panel.querySelector('.list') || {}).scrollTop || 0;
  hero(); pintar(); painel();
  const l = panel.querySelector('.list'); if (l) l.scrollTop = st;
  const br = D && D.pres.br, fim = br && br.f >= 0.9999, espera = br && br.st === 0;
  const live = document.getElementById('live');
  live.classList.toggle('off', !br || fim || espera || paused);
  document.getElementById('liveTxt').textContent = !br ? 'CARREGANDO' : fim ? 'TOTALIZADA' : espera ? 'AGUARDANDO' : paused ? 'PAUSADA' : 'AO VIVO';
  document.getElementById('clock').textContent = agora.toLocaleTimeString('pt-BR');
}

/* ---------- CICLO ---------- */
const banner = document.getElementById('banner');
async function atualizar(){
  if (paused) return;
  if (DEMO){ demoAvancar(speed); D = demoDados(); agora = new Date(); desenhar(); return; }
  try {
    const novo = await carregarTSE(turno);
    if (!novo.pres.br){ throw new Error('nacional indisponível'); }
    D = novo; agora = new Date(); banner.hidden = !novo.falhas;
    if (novo.falhas) banner.textContent = novo.falhas + ' arquivo(s) não puderam ser lidos agora: ' + novo.lista.join(', ') + '. Os demais estão atualizados.';
  } catch (err){
    banner.hidden = false;
    banner.textContent = 'Não foi possível ler os dados do TSE agora. Tentando de novo em instantes.' + (D ? ' Exibindo a última leitura.' : '');
  }
  desenhar();
}
function agendar(){
  if (timer) clearTimeout(timer);
  const fim = D && D.pres.br && D.pres.br.f >= 0.9999;
  timer = setTimeout(async () => { await atualizar(); agendar(); }, DEMO ? 1200 : (fim ? 300000 : INTERVALO_MS + Math.random() * 5000));
}
function trocarTurno(t){
  turno = t; sel = null; D = null; banner.hidden = true; desenhar();
  document.querySelectorAll('[data-turno]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.turno === t)));
  document.getElementById('sub').textContent = 'Presidente no Brasil e por estado · Governador nos estados e no DF com 2º turno · exibindo o ' + t + 'º turno';
  atualizar().then(agendar);
}
document.querySelectorAll('[data-turno]').forEach(b => b.addEventListener('click', () => trocarTurno(+b.dataset.turno)));
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
  speed = +b.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
document.getElementById('btnPause').addEventListener('click', e => { paused = !paused; e.currentTarget.textContent = paused ? 'Retomar' : 'Pausar'; desenhar(); });
document.getElementById('btnReset').addEventListener('click', () => { demoCriar(); for (let i = 0; i < 40; i++) demoAvancar(1); paused = false; document.getElementById('btnPause').textContent = 'Pausar'; atualizar(); });


/* ---------- RÁDIO ----------
   Sem arquivos, toca uma música ambiente gerada no próprio navegador (sem direitos autorais).
   Para tocar suas músicas, coloque os arquivos no repositório e liste aqui,
   por exemplo ['musicas/faixa1.mp3', 'musicas/faixa2.mp3'] (use só músicas que você tem direito de usar). */
const MUSICAS = [];
const BPM = 88, NOTA = m => 440 * Math.pow(2, (m - 69) / 12);
const ACORDES = [{ b: 45, n: [57,60,64,67] }, { b: 41, n: [53,57,60,64] }, { b: 48, n: [60,64,67,71] }, { b: 43, n: [55,59,62,64] }];
const ARP = [0,1,2,3,2,1,3,2];
const rBtn = document.getElementById('btnRadio'), rNext = document.getElementById('btnNext'), rVol = document.getElementById('vol'), rTrk = document.getElementById('trk');
let radioOn = false, ctx = null, master = null, bus = null, ruido = null, schedTimer = null, nextT = 0, passo = 0, audEl = null, faixa = 0;
try { const v = localStorage.getItem('apuracao-vol'); if (v !== null) rVol.value = v; } catch (e) {}
const vol = () => rVol.value / 100;
function montarAudio(){
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
  master = ctx.createGain(); master.gain.value = vol() * 0.8; master.connect(comp);
  bus = ctx.createGain(); const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200; bus.connect(lp); lp.connect(master);
  const conv = ctx.createConvolver(), len = Math.floor(ctx.sampleRate * 2), ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5); }
  conv.buffer = ir; const wet = ctx.createGain(); wet.gain.value = 0.35; lp.connect(conv); conv.connect(wet); wet.connect(master);
  ruido = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.05), ctx.sampleRate);
  const nd = ruido.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
function nota(f, t, dur, tipo, pico, atq, rel, det){
  const o = ctx.createOscillator(), g = ctx.createGain(); o.type = tipo; o.frequency.value = f; if (det) o.detune.value = det;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(pico, t + atq); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + rel + 0.05);
}
function chimbal(t){
  const s = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = ruido; hp.type = 'highpass'; hp.frequency.value = 7000; g.gain.value = 0.025; s.connect(hp); hp.connect(g); g.connect(bus); s.start(t);
}
function tocarPasso(s, t){
  const a = ACORDES[Math.floor(s / 8) % 4], pos = s % 8, beat = 60 / BPM;
  if (pos === 0){ a.n.forEach((m, i) => nota(NOTA(m), t, beat * 4, 'triangle', 0.05, 0.5, 1.2, i % 2 ? 6 : -6)); nota(NOTA(a.b), t, beat * 1.8, 'sine', 0.16, 0.02, 0.4); }
  if (pos === 4) nota(NOTA(a.b), t, beat * 1.5, 'sine', 0.12, 0.02, 0.4);
  if (Math.random() > 0.12) nota(NOTA(a.n[ARP[pos]] + 12), t, 0.12, 'sine', 0.07, 0.005, 0.45);
  if (pos % 2 === 1) chimbal(t);
}
function agendarSom(){ while (nextT < ctx.currentTime + 0.5){ tocarPasso(passo, nextT); nextT += 60 / BPM / 2; passo++; } }
function ligarSintese(){
  if (!ctx) montarAudio();
  ctx.resume(); nextT = ctx.currentTime + 0.1; schedTimer = setInterval(agendarSom, 120); rTrk.textContent = 'Música ambiente';
}
function desligarSintese(){ clearInterval(schedTimer); if (ctx) ctx.suspend(); }
function nomeFaixa(u){ return decodeURIComponent(String(u).split('/').pop().replace(/\.[a-z0-9]+$/i, '')); }
function carregarFaixa(i){ audEl.src = MUSICAS[i]; rTrk.textContent = nomeFaixa(MUSICAS[i]); }
function proxima(){ faixa = (faixa + 1) % MUSICAS.length; carregarFaixa(faixa); if (radioOn) audEl.play().catch(() => {}); }
function ligarLista(){
  if (!audEl){ audEl = new Audio(); audEl.preload = 'auto'; audEl.addEventListener('ended', proxima); carregarFaixa(faixa); }
  audEl.volume = vol(); audEl.play().catch(() => { rTrk.textContent = 'Não foi possível tocar'; });
}

/* YouTube: o dono do site pode deixar um link padrão aqui (vídeo ou playlist);
   cada visitante também pode colar o próprio link no botão "YouTube". */
const YOUTUBE = '';
let ytLink = YOUTUBE, yt = null, fonte = MUSICAS.length ? 'lista' : 'sintese';
try { ytLink = localStorage.getItem('apuracao-yt') || YOUTUBE; } catch (e) {}
if (ytLink) fonte = 'yt';
const popEl = document.getElementById('pop'), ytCard = document.getElementById('ytcard'), ytIn = document.getElementById('ytIn');
function ytParse(s){
  s = String(s || '').trim();
  const list = (s.match(/[?&]list=([\w-]+)/) || [])[1];
  let vid = (s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || [])[1];
  if (!vid && /^[\w-]{11}$/.test(s)) vid = s;
  return { list, vid };
}
function ytCarregarAPI(cb){
  if (window.YT && window.YT.Player){ cb(); return; }
  window.onYouTubeIframeAPIReady = cb;
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => { rTrk.textContent = 'YouTube indisponível aqui'; ytCard.hidden = true; fonte = MUSICAS.length ? 'lista' : 'sintese'; };
  document.head.appendChild(s);
}
function ytLigar(){
  const p = ytParse(ytLink);
  if (!p.list && !p.vid){ rTrk.textContent = 'Link do YouTube inválido'; return; }
  ytCard.hidden = false; rTrk.textContent = 'YouTube';
  ytCarregarAPI(() => {
    if (!yt){
      yt = new YT.Player('ytp', { width: '220', height: '200', videoId: p.list ? undefined : p.vid,
        playerVars: p.list ? { listType: 'playlist', list: p.list, playsinline: 1, rel: 0 } : { playsinline: 1, rel: 0 },
        events: { onReady: e => { e.target.setVolume(vol() * 100); if (radioOn) e.target.playVideo(); } } });
    } else {
      if (p.list) yt.loadPlaylist({ listType: 'playlist', list: p.list }); else yt.loadVideoById(p.vid);
      yt.setVolume(vol() * 100);
    }
  });
}
function ytParar(){
  if (yt && yt.pauseVideo) yt.pauseVideo();
  ytCard.hidden = true; ytLink = ''; fonte = MUSICAS.length ? 'lista' : 'sintese';
  try { localStorage.removeItem('apuracao-yt'); } catch (e) {}
  rTrk.textContent = ''; if (radioOn) ligar();
}
function ligar(){ if (fonte === 'yt') ytLigar(); else if (fonte === 'lista') ligarLista(); else ligarSintese(); }
function desligar(){
  if (fonte === 'yt'){ if (yt && yt.pauseVideo) yt.pauseVideo(); }
  else if (fonte === 'lista'){ if (audEl) audEl.pause(); }
  else desligarSintese();
}
function rotuloRadio(){ rBtn.setAttribute('aria-pressed', String(radioOn)); rBtn.textContent = radioOn ? '♪ Rádio ligada' : '♪ Ligar rádio'; }
rBtn.addEventListener('click', () => { radioOn = !radioOn; rotuloRadio(); if (radioOn) ligar(); else desligar(); });
document.getElementById('btnYt').addEventListener('click', e => {
  popEl.hidden = !popEl.hidden; e.currentTarget.setAttribute('aria-expanded', String(!popEl.hidden));
  if (!popEl.hidden){ ytIn.value = ytLink; ytIn.focus(); }
});
document.getElementById('ytGo').addEventListener('click', () => {
  const p = ytParse(ytIn.value);
  if (!p.list && !p.vid){ rTrk.textContent = 'Link do YouTube inválido'; return; }
  if (radioOn) desligar();
  ytLink = ytIn.value.trim(); fonte = 'yt'; radioOn = true; rotuloRadio();
  try { localStorage.setItem('apuracao-yt', ytLink); } catch (e) {}
  popEl.hidden = true; document.getElementById('btnYt').setAttribute('aria-expanded', 'false');
  ytLigar();
});
document.getElementById('ytOff').addEventListener('click', () => { popEl.hidden = true; document.getElementById('btnYt').setAttribute('aria-expanded', 'false'); if (fonte === 'yt') ytParar(); });
document.getElementById('ytClose').addEventListener('click', ytParar);
rVol.addEventListener('input', () => {
  if (master) master.gain.value = vol() * 0.8; if (audEl) audEl.volume = vol(); if (yt && yt.setVolume) yt.setVolume(vol() * 100);
  try { localStorage.setItem('apuracao-vol', rVol.value); } catch (e) {}
});

  document.getElementById('demoCtl').hidden = false;

  document.getElementById('sub').textContent = 'Layout de demonstração com candidatos e números fictícios';
  demoCriar(); for (let i = 0; i < 40; i++) demoAvancar(1);
  atualizar().then(agendar);
} else {
  desenhar(); trocarTurno(2);
}
