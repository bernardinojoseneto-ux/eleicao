# RESERVA: só use se o navegador não conseguir ler o TSE direto (erro de CORS).
# Copia os JSON do TSE para a pasta dados/ a cada ~5 min; o index.html lê dali sozinho.
name: espelho-tse
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  espelho:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar arquivos do TSE
        run: |
          B=https://resultados.tse.jus.br
          UFS="br ac al am ap ba ce df es go ma mg ms mt pa pb pe pi pr rj rn ro rr rs sc se sp to zz"
          GOV="ac am df es rn to"
          get() { mkdir -p "dados$(dirname "$1")"; curl -fsS --max-time 20 "$B$1" -o "dados$1.tmp" && mv "dados$1.tmp" "dados$1" || rm -f "dados$1.tmp"; }
          for u in $UFS; do get "/oficial/ele2026/6257/dados/$u/$u-c0001-e006257-u.json"; done
          for u in $GOV; do get "/oficial/ele2026/6259/dados/$u/$u-c0003-e006259-u.json"; done
          # 2º turno só a partir do dia da votação (evita 404 repetido, que bloqueia o IP)
          if [ "$(date -u +%Y%m%d)" -ge 20261025 ]; then
            for u in $UFS; do get "/oficial/ele2026/6258/dados/$u/$u-c0001-e006258-u.json"; done
            for u in $GOV; do get "/oficial/ele2026/6260/dados/$u/$u-c0003-e006260-u.json"; done
          fi
      - name: Publicar mudanças
        run: |
          git config user.name "espelho-tse"; git config user.email "actions@users.noreply.github.com"
          git add dados && (git diff --cached --quiet || git commit -m "dados TSE" && git push)
